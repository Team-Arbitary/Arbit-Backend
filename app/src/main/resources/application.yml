server:
  port: ${SERVER_PORT:5509}
  address: 0.0.0.0

base-url:
  context: /transformer-thermal-inspection

# Analysis API configuration
analysis:
  api:
    url: http://0.0.0.0:8000

log:
  identifierKey: UUID
  isDebug: true

info:
  app:
    name: base-template
    msName: base-template

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trasformer_inspection_db
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      leak-detection-threshold: 60000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jpa:
    hibernate:
      ddl-auto: update # options: validate | update | create | create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: true

rest:
  connect-timeout: 5000
  read-timeout: 20000

# Actuator configuration for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    filter: true
    showExtensions: true
    showCommonExtensions: true
  show-actuator: true

# Logging configuration
logging:
  level:
    com.uom.Software_design_competition: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT configuration - make sure to set a strong secret for production via env var JWT_SECRET or property jwt.secret
jwt:
  # default (for dev only) — replace with a long, random secret for production or set env JWT_SECRET
  secret: ${JWT_SECRET:dev-secret-change-me-please-2025-11-23-0123456789}
